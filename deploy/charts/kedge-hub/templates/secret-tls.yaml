{{- if and .Values.hub.tls.selfSigned.enabled (not .Values.hub.tls.existingSecret) (not .Values.hub.tls.certManager.enabled) }}
{{- $fullname := include "kedge-hub.fullname" . }}
{{- $dnsNames := concat
  (list "localhost" $fullname (printf "%s-dex" $fullname)
    (printf "%s.%s.svc" $fullname .Release.Namespace)
    (printf "%s-dex.%s.svc" $fullname .Release.Namespace))
  .Values.hub.tls.selfSigned.dnsNames
}}
{{- $ips := list }}
{{- range .Values.hub.tls.selfSigned.ipAddresses }}
{{- $ips = append $ips . }}
{{- end }}
{{- $ca := genCA "kedge-hub-ca" 365 }}
{{- $cert := genSignedCert "kedge-hub" $ips $dnsNames 365 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kedge-hub.tlsSecretName" . }}
  labels:
    {{- include "kedge-hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
