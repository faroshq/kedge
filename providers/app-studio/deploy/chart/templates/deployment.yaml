{{- $catalogEntryConfigMap := and .Values.catalogEntry.enabled .Values.catalogEntry.renderAsConfigMap -}}
{{- $actionsCABundleConfigMap := .Values.hub.actionsCABundleConfigMap.name -}}
{{- if ne (int .Values.replicaCount) 1 -}}
{{- fail "app-studio replicaCount must be 1 because assistant project mutations require a single active writer" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appstudio.fullname" . }}
  labels:
    {{- include "appstudio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "appstudio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "appstudio.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "appstudio.serviceAccountName" . }}
      # The provider uses the explicitly mounted workspace-admin kubeconfig;
      # neither the provider nor its browser-worker sidecar should receive an
      # ambient Kubernetes ServiceAccount token.
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Bootstrap the provider workspace (schemas, APIExport, slice, bind
        # grant) with the onboarded workspace-admin kubeconfig. Schemas baked at
        # /etc/kedge/schemas (Dockerfile). Idempotent.
        - name: init
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["init"]
          env:
            - name: KEDGE_PROVIDER_KUBECONFIG
              value: /var/run/secrets/kedge/kedge-provider-kubeconfig
            - name: KEDGE_SCHEMAS_DIR
              value: /etc/kedge/schemas
            {{- if .Values.apiExport.infraIdentityHash }}
            # identityHash of the infrastructure APIExport — required for the
            # first-party instance permission claims (see values.yaml).
            - name: APP_STUDIO_INFRA_IDENTITY_HASH
              value: {{ .Values.apiExport.infraIdentityHash | quote }}
            {{- end }}
            {{- if .Values.apiExport.codeIdentityHash }}
            - name: APP_STUDIO_CODE_IDENTITY_HASH
              value: {{ .Values.apiExport.codeIdentityHash | quote }}
            {{- end }}
            {{- if $catalogEntryConfigMap }}
            # The CatalogEntry is a kcp resource, so the chart cannot apply it to
            # the hosting cluster. It is rendered into a ConfigMap (mounted below)
            # and init self-registers it into the provider workspace via the
            # provider kubeconfig.
            - name: KEDGE_CATALOGENTRY_FILE
              value: /etc/kedge/catalogentry/catalogentry.yaml
            {{- end }}
          volumeMounts:
            - name: kedge-provider-kubeconfig
              mountPath: /var/run/secrets/kedge
              readOnly: true
            {{- if $catalogEntryConfigMap }}
            - name: catalogentry
              mountPath: /etc/kedge/catalogentry
              readOnly: true
            {{- end }}
      containers:
        - name: provider
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          env:
            - name: PORT
              value: "8081"
            - name: KEDGE_HUB_URL
              value: {{ .Values.hub.url | quote }}
            {{- if .Values.hub.actionsExternalURL }}
            - name: KEDGE_ACTIONS_EXTERNAL_URL
              value: {{ .Values.hub.actionsExternalURL | quote }}
            {{- end }}
            {{- if $actionsCABundleConfigMap }}
            - name: KEDGE_ACTIONS_CA_BUNDLE_FILE
              value: /etc/kedge/actions-ca/ca-bundle.pem
            {{- end }}
            - name: KEDGE_PROVIDER_NAME
              value: "app-studio"
            # Provider kubeconfig — used for the kcp front-proxy host + TLS
            # only; the tenant client drops its credential and acts as the
            # calling user via the forwarded bearer token.
            - name: KEDGE_PROVIDER_KUBECONFIG
              value: /var/run/secrets/kedge/kedge-provider-kubeconfig
            - name: APP_STUDIO_WORKSPACE_ROOT
              value: {{ .Values.workspace.path | quote }}
            {{- if .Values.browserWorker.enabled }}
            - name: APP_STUDIO_BROWSER_WORKER_URL
              value: {{ printf "http://127.0.0.1:%v" .Values.browserWorker.port | quote }}
            {{- end }}
            {{- if .Values.store.databaseURL }}
            - name: APP_STUDIO_DATABASE_URL
              value: {{ .Values.store.databaseURL | quote }}
            {{- else if .Values.store.databaseURLSecretRef.name }}
            - name: APP_STUDIO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.databaseURLSecretRef.name }}
                  key: {{ .Values.store.databaseURLSecretRef.key }}
            {{- end }}
            {{- if .Values.store.inMemoryMessageStore }}
            - name: APP_STUDIO_IN_MEMORY_MESSAGE_STORE
              value: "true"
            {{- end }}
            {{- with .Values.assistant.toolDisclosure }}
            # "minimal" hides action targets and outcomes from the chat.
            # Default "summary" shows product-level action details only;
            # raw tool names, arguments, and output are never exposed.
            - name: APP_STUDIO_TOOL_DISCLOSURE
              value: {{ . | quote }}
            {{- end }}
            - name: APP_STUDIO_PREVIEW_CONSOLE_ENABLED
              value: {{ .Values.previewConsole.enabled | quote }}
            {{- if and .Values.previewConsole.enabled (or .Values.previewConsole.signingKeyID .Values.previewConsole.signingKeySecretRef.name) }}
            - name: APP_STUDIO_PREVIEW_CONSOLE_SIGNING_KEY_ID
              value: {{ required "previewConsole.signingKeyID is required when previewConsole.enabled=true" .Values.previewConsole.signingKeyID | quote }}
            - name: APP_STUDIO_PREVIEW_CONSOLE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "previewConsole.signingKeySecretRef.name is required when previewConsole.enabled=true" .Values.previewConsole.signingKeySecretRef.name }}
                  key: {{ .Values.previewConsole.signingKeySecretRef.key | default "private-key.pem" }}
            {{- end }}
            {{- if .Values.store.messageRetention }}
            - name: APP_STUDIO_MESSAGE_RETENTION
              value: {{ .Values.store.messageRetention | quote }}
            {{- end }}
            {{- if .Values.store.messageEncryptionKeysSecretRef.name }}
            - name: APP_STUDIO_MESSAGE_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.store.messageEncryptionKeysSecretRef.name }}
                  key: {{ .Values.store.messageEncryptionKeysSecretRef.key }}
            {{- end }}
            {{- if .Values.hub.insecure }}
            - name: KEDGE_HUB_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.hub.tokenSecretRef.name }}
            - name: KEDGE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.tokenSecretRef.name }}
                  key: {{ .Values.hub.tokenSecretRef.key }}
            {{- end }}
          volumeMounts:
            # The onboarded workspace-admin kubeconfig; the SA token inside is
            # what the tenant client presents to reach tenant workspaces.
            - name: kedge-provider-kubeconfig
              mountPath: /var/run/secrets/kedge
              readOnly: true
            - name: project-workspaces
              mountPath: {{ .Values.workspace.path | quote }}
            {{- if $actionsCABundleConfigMap }}
            - name: actions-ca-bundle
              mountPath: /etc/kedge/actions-ca
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.browserWorker.enabled }}
        - name: browser-worker
          image: "{{ .Values.browserWorker.image.repository }}:{{ default .Chart.AppVersion .Values.browserWorker.image.tag }}"
          imagePullPolicy: {{ .Values.browserWorker.image.pullPolicy }}
          ports:
            - name: browser-http
              containerPort: {{ .Values.browserWorker.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.browserWorker.port | quote }}
            - name: BROWSER_WORKER_TIMEOUT_MS
              value: {{ .Values.browserWorker.timeoutMs | quote }}
            - name: BROWSER_WORKER_IGNORE_HTTPS_ERRORS
              value: {{ .Values.browserWorker.ignoreHTTPSErrors | quote }}
            - name: HOME
              value: /tmp/browser-worker
            - name: XDG_CACHE_HOME
              value: /tmp/browser-worker/cache
            - name: XDG_CONFIG_HOME
              value: /tmp/browser-worker/config
          livenessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:{{ .Values.browserWorker.port }}/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:{{ .Values.browserWorker.port }}/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: browser-worker-tmp
              mountPath: /tmp
            - name: browser-worker-shm
              mountPath: /dev/shm
          resources:
            {{- toYaml .Values.browserWorker.resources | nindent 12 }}
        {{- end }}
      volumes:
        # Required input: the workspace-admin kubeconfig minted via /bonkers
        # (admin onboarding), consumed by both init and serve. The onboard
        # response stores it under key "kubeconfig"; map it to the file path the
        # provider reads.
        - name: kedge-provider-kubeconfig
          secret:
            secretName: {{ .Values.providerKubeconfig.secretName }}
            items:
              - key: kubeconfig
                path: kedge-provider-kubeconfig
        {{- if $catalogEntryConfigMap }}
        - name: catalogentry
          configMap:
            name: {{ include "appstudio.fullname" . }}-catalogentry
        {{- end }}
        - name: project-workspaces
          {{- if .Values.workspace.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.workspace.existingClaim | quote }}
          {{- else if or .Values.workspace.emptyDir (not .Values.workspace.persistence.enabled) }}
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "appstudio.fullname" . }}-workspaces
          {{- end }}
        {{- if $actionsCABundleConfigMap }}
        - name: actions-ca-bundle
          configMap:
            name: {{ $actionsCABundleConfigMap | quote }}
            items:
              - key: {{ .Values.hub.actionsCABundleConfigMap.key | quote }}
                path: ca-bundle.pem
        {{- end }}
        {{- if .Values.browserWorker.enabled }}
        - name: browser-worker-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: browser-worker-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
