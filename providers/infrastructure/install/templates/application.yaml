apiVersion: infrastructure.kedge.faros.sh/v1alpha1
kind: Template
metadata:
  name: application
  annotations:
    # database.version: a Postgres major upgrade is not an in-place operation;
    # update_instance rejects it (recreate — and migrate — instead).
    kedge.faros.sh/immutable-inputs: "database.version"
spec:
  displayName: "Web application"
  description: "A 3-tier app — frontend + backend + Postgres — exposed on a URL guarded by OIDC (oauth2-proxy). Authenticated users only; the backend and database are never exposed."
  category: Workloads
  version: 0.2.0
  # exposure: what the platform tells callers about reaching an instance.
  # Every instance gets an HTTPRoute. The template brings its own gate
  # (oauth2-proxy, oidc.mode) — the platform adds none.
  exposure: public
  backend: kro
  # Example payload the portal pre-fills the provision form with, so the 3-tier
  # demo is effectively one click. The frontend/backend images are the scaffold
  # repo's hello-world tiers (github.com/faroshq/kedge-scaffold-application),
  # built by that repo's CI and pinned to the SAME tag as
  # development.scaffold.ref below — "just click provision" runs exactly the
  # code a new App Studio project starts from. oidc.mode=none drops the auth
  # gate so "Provision → see it working" needs zero external setup (demo/dev).
  sampleValues:
    name: demo
    frontendImage: ghcr.io/faroshq/kedge-scaffold-application/web:v0.1.1
    backendImage: ghcr.io/faroshq/kedge-scaffold-application/api:v0.1.1
    database:
      version: "16"
    oidc:
      mode: none
  # Operational guidance for AI agents discovering this template over MCP. Not
  # shown in the portal UI — it tells an LLM how to use the template and where
  # its outputs (URL, DB secret) land.
  agent:
    usage: |
      Deploys a 3-tier web app on ONE public URL: UI at `/`, API at `/api/*`, and a
      managed PostgreSQL database. Choose this to ship a containerized web app with
      a relational DB behind a single endpoint when you can supply both images.
      For a frontend-only or single-container app with no API tier and no database
      (a static site, an SPA, a self-contained server), prefer the simple-webapp
      template — it is also development-capable and carries none of this weight.

      READ THE DEVELOPMENT MODE SECTION BELOW BEFORE WRITING ANY CODE. The
      language rules differ by mode: PRODUCTION mode runs container images you
      build, in any language; DEVELOPMENT mode (kedgeMode: development, what an
      App Studio project uses while you build it) runs BOTH tiers in a Node.js
      sandbox image and can execute nothing else. Everything below headed
      "IMAGES" applies to production images only.

      PRODUCTION MODE — YOU SUPPLY exactly two container images — frontendImage
      and backendImage —
      and nothing else app-side. The platform provisions Postgres, injects the DB
      connection, path-routes one URL to both tiers, and (in byo mode) authenticates
      in front; you do NOT create the database, Secrets, Services, or routes. This
      contract is fully self-contained — build BOTH images from it BEFORE you
      provision; the only runtime couplings are the env var and ports below.

      BOTH IMAGES (production mode only — see DEVELOPMENT MODE for the sandbox):
        • Plain HTTP server, any language/base image. Bind to 0.0.0.0 on the port
          below (NOT 127.0.0.1), or the platform cannot route to it.
        • Stateless — no local/persistent disk; ALL state lives in Postgres. Pods
          may be restarted or scaled (the *Replicas inputs).

      BACKEND (backendImage) — the platform routes `/api/*` to it:
        • Env DATABASE_URL is injected — a PostgreSQL URI of the form
          `postgres://appuser:<password>@<host>:5432/appdb`. Connect from this env
          ONLY (never read a Kubernetes Secret). The URI has NO sslmode and the
          in-cluster Postgres has TLS disabled, so connect with sslmode=disable
          (append `?sslmode=disable` / set it if your driver defaults to requiring
          TLS, e.g. Node `pg`, JDBC).
        • Engine: PostgreSQL, major version = the database.version input ("15"|"16",
          default "16"). Database `appdb`, user `appuser`. It starts EMPTY — create
          your schema / run migrations on startup, idempotently.
        • Postgres may not be ready the moment you start (it boots alongside you) —
          RETRY the initial connection instead of exiting.
        • Listen on backendPort (input, default 8080). Serve your routes under the
          `/api/` prefix; the path is PRESERVED (you receive e.g. `/api/items`, not
          `/items`). A readiness endpoint that pings the DB is recommended.
        • The HTTP API shape (routes, JSON) is YOUR design — you also build the
          frontend that calls it; the only platform constraint is the `/api` prefix.

      FRONTEND (frontendImage) — the platform routes `/` to it:
        • Listen on frontendPort (input, default 8080); serve the UI on `/`.
          $PORT (= frontendPort) is injected, so an app that honors $PORT binds
          the right port automatically.
        • Call the backend from the BROWSER at `/api/*` on the SAME origin (e.g.
          `fetch("/api/items")`). There is NO separate backend host/URL — do not
          hardcode one or expect a backend env var. No database access.

      EXPOSURE & AUTH (oidc.mode input):
        • none — no auth gate; the URL is public. Demo/dev only.
        • byo  — oauth2-proxy gates BOTH `/` and `/api` with the caller's OIDC IdP
          (set oidc.issuerURL + oidc.clientID; client secret via prerequisites).
        • platform — kedge SSO; NOT yet supported.

      DEVELOPMENT MODE (provision with kedgeMode: development): both image
      inputs are ignored (and may be omitted) — each tier runs in a
      platform-managed Node.js sandbox image against its own workspace directory
      (frontend → web/, backend → api/), with Postgres and DATABASE_URL exactly
      as in production. Push source with the dev_sync tool (hot reload, no image
      builds; files are routed by those directories), read dev-server logs with
      dev_logs, and preview on the instance's status.url.

        • BOTH TIERS MUST BE WRITTEN IN NODE.JS/JAVASCRIPT/TYPESCRIPT. The
          sandbox image contains the Node toolchain and NOTHING ELSE — no Go,
          Python, Ruby, Java, or .NET compiler or interpreter is installed. Go
          source, a Python app, or any other stack placed in web/ or api/ cannot
          run there however correct it is: the start command finds nothing to
          launch and the tier silently never listens on its port.
        • api/ MUST contain a package.json whose "dev" or "start" script starts
          the server on $PORT (the backend is started with
          `npm run dev || npm start`). Without that file nothing runs.
        • web/ MUST contain a package.json for a vite-based frontend (started
          with `npm run dev`, falling back to `npx vite`).
        • A Dockerfile is for the PRODUCTION image build only — it is never
          built or executed in development mode, so adding one does NOT make
          another language runnable in the sandbox.
        • If the app genuinely requires a non-Node backend, this template cannot
          develop it: say so and pick a template whose development toolchain
          matches, rather than writing source the sandbox cannot execute.

      INPUTS you set when provisioning: frontendImage, backendImage (default to
      the scaffold hello-world images — supply your own to run real code; omit
      in development mode); name, frontendPort,
      backendPort, frontendReplicas, backendReplicas, frontendEnv, backendEnv
      (per-tier env-var maps; not for secrets), database.version, oidc.*. The
      platform stamps spec.expose.fqdn and spec.credentialsSecretName — do not
      set those. All except name, kedgeMode, and database.version can be
      changed later with update_instance.
    prerequisites:
      - "oidc.mode=byo only: a Secret named 'cloud-credentials' in the tenant's default namespace, key 'oidc_client_secret' = the OAuth2 client secret for your oidc.clientID."
    outputs:
      - "status.url — the public HTTPS URL the app is served on (status.host = bare hostname)."
      - "status.redirectURL — the OIDC redirect/callback URL to register with your IdP (byo mode)."
      - "Per-tier readiness: status.frontendReady / backendReady / databaseReady / oauthReady (ready replica counts)."
      - "The backend's DATABASE_URL env is sourced from Secret '<name>-db-credentials' (key 'uri') in the instance namespace — informational; the image just reads the DATABASE_URL env, it never reads the Secret."
  # ── Portal presentation ───────────────────────────────────────────────
  # Tells the portal how to render this template's instances instead of the
  # default raw-JSON values dump. Field values are dot-paths or ${…}-interpolated
  # strings resolved against the instance's spec.* (inputs), status.* (computed
  # outputs), and meta.* (name/phase/…). type ∈ text|link|badge|code.
  view:
    # Extra columns in the "My instances" table (after Name/Template).
    columns:
      - header: URL
        value: "${status.url}"
        type: link
      - header: Auth
        path: spec.oidc.mode
        type: badge
    # Field groups on the instance detail page (replace the raw values dump).
    detail:
      - title: Access
        fields:
          - label: URL
            value: "${status.url}"
            type: link
          - label: Hostname
            path: status.host
            type: code
          - label: Redirect URL
            value: "${status.redirectURL}"
            type: link
      - title: Configuration
        fields:
          - label: Auth mode
            path: spec.oidc.mode
            type: badge
          - label: Postgres version
            path: spec.database.version
            type: badge
          - label: DB secret
            path: status.dbConnectionSecretRef.name
            type: code
      - title: Readiness
        fields:
          - label: Frontend
            path: status.frontendReady
          - label: Backend
            path: status.backendReady
          - label: Database
            path: status.databaseReady
  instanceCRD:
    group: infrastructure.kedge.faros.sh
    version: v1alpha1
    resource: applications
    kind: Application
  # ── Tenant-facing inputs ──────────────────────────────────────────────
  # Nested objects (database/expose/oidc) are supported by the kro
  # SimpleSchema converter (backend/kro/simpleschema.go recurses).
  #
  # Two fields are populated by the Application instance controller, NOT the
  # tenant, and must NOT be set by hand:
  #   - expose.fqdn            the public hostname, computed as
  #                            <prefix|name>-<tenantHash>.apps.<baseDomain>
  #   - credentialsSecretName  the runtime Secret the controller bridges the
  #                            OIDC client secret into (key: oidc_client_secret)
  # The RGD below references both; the controller stamps them onto spec before
  # kro reconciles (see controller/application).
  schema:
    type: object
    properties:
      name:
        type: string
        description: "Logical name; used as the resource-name prefix in the tenant namespace and the default hostname prefix."

      # ── Frontend tier (the only tier exposed, behind oauth2-proxy) ──
      frontendImage:
        type: string
        default: ghcr.io/faroshq/kedge-scaffold-application/web:v0.1.1
        description: "Container image for the public-facing frontend. Defaults to the scaffold hello-world (same tag as development.scaffold.ref) so provisioning with no images runs a working app — replace with your own image to ship real code. Ignored when kedgeMode is development — dev mode runs the platform dev image against the project workspace."
      frontendPort:
        type: integer
        default: 8080
        description: "Port the frontend container listens on."
      frontendReplicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 10
      frontendEnv:
        type: object
        additionalProperties:
          type: string
        default: {}
        description: "Environment variables for the frontend container, injected via a ConfigMap + envFrom (updatable in place). Platform-set vars (PORT) win on name conflicts. Values are stored world-readable — not for secrets."

      # ── Backend tier (internal; reachable only via cluster DNS) ──
      backendImage:
        type: string
        default: ghcr.io/faroshq/kedge-scaffold-application/api:v0.1.1
        description: "Container image for the internal backend/API tier. Defaults to the scaffold hello-world (same tag as development.scaffold.ref) so provisioning with no images runs a working app — replace with your own image to ship real code. Ignored when kedgeMode is development."
      backendPort:
        type: integer
        default: 8080
      backendReplicas:
        type: integer
        default: 1
        minimum: 1
        maximum: 10
      backendEnv:
        type: object
        additionalProperties:
          type: string
        default: {}
        description: "Environment variables for the backend container, injected via a ConfigMap + envFrom (updatable in place). Platform-set vars (PORT, DATABASE_URL) win on name conflicts. Values are stored world-readable — not for secrets."

      # ── Database tier (Postgres; always provisioned in v1) ──
      # default: {} so an omitted database object is instantiated and its nested
      # defaults (version/size) apply — the RGD references ${schema.spec.database.version}
      # unconditionally, so a missing database object fails resource rendering.
      database:
        type: object
        default: {}
        properties:
          size:
            type: string
            enum: ["small", "medium", "large"]
            default: "small"
            description: "Reserved for v1 (accepted but not yet wired to resources/storage), mirroring redis-cache."
          version:
            type: string
            enum: ["15", "16"]
            default: "16"

      # ── Exposure ──
      # default: {} so nested defaults apply and the controller can stamp fqdn
      # onto an instance that omitted the expose object.
      expose:
        type: object
        default: {}
        properties:
          hostnamePrefix:
            type: string
            pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
            maxLength: 50
            description: "Left-most DNS label. Defaults to .name. Final host = <prefix>-<tenantHash>.<appBaseDomain>."
          fqdn:
            type: string
            description: "Computed by the platform — do NOT set. The public hostname the app is served on."

      # ── OIDC (the gate in front of the frontend) ──
      # default: {} so oidc.mode defaults to "none" when the object is omitted —
      # the HTTPRoute backend references ${schema.spec.oidc.mode} unconditionally.
      oidc:
        type: object
        default: {}
        properties:
          mode:
            type: string
            enum: ["none", "byo", "platform"]
            default: "none"
            description: "none (default) = NO auth gate; the HTTPRoute routes straight to the frontend so anyone with the URL can reach it (demo/dev only). byo = your own IdP; set issuerURL + clientID and put the client secret in your cloud-credentials Secret under key oidc_client_secret. platform = guard with kedge SSO — NOT yet supported (requires the hub Dex gRPC client-management API; tracked separately)."
          issuerURL:
            type: string
            description: "BYO mode: your IdP's OIDC issuer URL (required)."
          clientID:
            type: string
            description: "BYO mode: your OAuth2 client ID (required)."
          emailDomains:
            type: array
            items:
              type: string
            description: "Reserved for v1 (accepted but not yet wired; defaults to allowing any authenticated user)."
          scopes:
            type: string
            default: "openid email profile"

      # Controller-injected; see the schema header comment.
      credentialsSecretName:
        type: string
        description: "Computed by the platform — do NOT set."
    required:
      - name
    # Images are only required when the instance actually runs them: production
    # mode. Development mode (the platform-injected kedgeMode field) swaps the
    # tier images for platform dev images, so a dev-only project needs none.
    # Enforced on the kcp-side CRD; kedgeMode defaults to "production".
    x-kubernetes-validations:
      - rule: "(has(self.kedgeMode) && self.kedgeMode == 'development') || (has(self.frontendImage) && has(self.backendImage))"
        message: "frontendImage and backendImage are required in production mode"

  # ── Development mode (docs/app-studio-template-sandboxes.md) ──────────
  # Declares how instances run when provisioned with kedgeMode: development:
  # the frontend and backend tiers hot-swap to platform dev images running the
  # kedge-dev-agent against per-component workspace PVCs, while Postgres (and
  # the oauth gate, if enabled) run exactly as in production. The kro backend
  # synthesizes the overlay from this block — there is no second graph.
  #
  # v1 dev shape is node on both tiers (the scaffold ships a node frontend +
  # node backend); per-instance toolchain selection is a follow-up. The
  # frontend start command reuses the sandbox-runner vite shim (same base64,
  # same single-line/no-double-quote constraints do NOT apply here — this
  # lands in a Deployment env value — but the shim itself is proven, so it is
  # carried verbatim): it forces server.host + server.allowedHosts so the dev
  # server accepts the proxied preview Host header, and dynamically loads the
  # platform preview-console plugin when trusted keys are installed. Missing
  # plugin/config fails open and leaves the ordinary preview intact.
  development:
    # Starter source for new App Studio projects: a working web+api+Postgres
    # hello-world honoring the full platform contract (PORT, same-origin
    # /api/*, DATABASE_URL with startup retry, dev+start scripts). Locked by
    # git tag: changing the scaffold repo does nothing until a new tag is cut
    # AND this ref (plus the sampleValues image tags above) is bumped to match.
    scaffold:
      repository: https://github.com/faroshq/kedge-scaffold-application
      ref: v0.1.1
    components:
      frontend:
        workspacePath: web
        imageInput: frontendImage
        devImage: "${kedge.devImage.node}"
        workingDir: /workspace
        startCommand: "SHIM=.kedge-vite.config.mjs; printf '%s' '' | base64 -d > $SHIM; grep -qxF $SHIM .gitignore 2>/dev/null || echo $SHIM >> .gitignore; if [ -f package.json ]; then (npm run dev -- --host 0.0.0.0 --port $PORT --config $SHIM || npm run dev -- --host 0.0.0.0 --port $PORT || npm start); else npx --yes vite --host 0.0.0.0 --port $PORT --config $SHIM || npx --yes vite --host 0.0.0.0 --port $PORT; fi"
        port: frontend
        reload:
          strategy: process
          rules:
            - paths: ["package.json", "package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml"]
              command: "npm install --no-audit --no-fund"
      backend:
        workspacePath: api
        imageInput: backendImage
        devImage: "${kedge.devImage.node}"
        workingDir: /workspace
        startCommand: "npm run dev || npm start"
        port: backend
        reload:
          strategy: process
          rules:
            - paths: ["package.json", "package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml"]
              command: "npm install --no-audit --no-fund"

  # ── Data plane (development mode) ─────────────────────────────────────
  # Per-component control verbs, served as
  # …/applications/<name>/components/{frontend,backend}/{sync,restart,log,env,process}.
  # The status paths they resolve through (status.components.*, controlSecretRef,
  # runtimeNamespace) are published by the synthesized dev overlay, so in
  # production mode these verbs answer 409 instance-not-ready — the data plane
  # is a development-mode surface.
  dataPlane:
    runtimeNamespacePath: status.runtimeNamespace
    tokenSecretPath: status.controlSecretRef
    endpoints:
      status:
        fromStatus: true
    components:
      frontend:
        endpoints:
          sync:
            servicePath: status.components.frontend.controlServiceRef
            port: control
            upstreamPath: /sync
            methods: ["POST"]
          restart:
            servicePath: status.components.frontend.controlServiceRef
            port: control
            upstreamPath: /restart
            methods: ["POST"]
          env:
            servicePath: status.components.frontend.controlServiceRef
            port: control
            upstreamPath: /env
            methods: ["POST"]
          log:
            servicePath: status.components.frontend.controlServiceRef
            port: control
            upstreamPath: /logs
            methods: ["GET"]
            stream: true
          process:
            servicePath: status.components.frontend.controlServiceRef
            port: control
            upstreamPath: /status
            methods: ["GET"]
      backend:
        endpoints:
          sync:
            servicePath: status.components.backend.controlServiceRef
            port: control
            upstreamPath: /sync
            methods: ["POST"]
          restart:
            servicePath: status.components.backend.controlServiceRef
            port: control
            upstreamPath: /restart
            methods: ["POST"]
          env:
            servicePath: status.components.backend.controlServiceRef
            port: control
            upstreamPath: /env
            methods: ["POST"]
          log:
            servicePath: status.components.backend.controlServiceRef
            port: control
            upstreamPath: /logs
            methods: ["GET"]
            stream: true
          process:
            servicePath: status.components.backend.controlServiceRef
            port: control
            upstreamPath: /status
            methods: ["GET"]

  # ── backendConfig: the kro resource graph ─────────────────────────────
  # Interpreted by the kro backend. Every resource sets namespace: default —
  # the control-plane/data-plane split materializes these on the runtime
  # cluster and remaps that to the per-tenant namespace (kedge-tenants-<hash>),
  # so a tenant's whole app lands together and is isolated from other tenants.
  #
  # Reserved kedge tokens: ${kedge.gatewayName} / ${kedge.gatewayNamespace}
  # are substituted for the platform's configured Gateway API parent
  # (KEDGE_GATEWAY_NAME / KEDGE_GATEWAY_NAMESPACE, default
  # "cloudflare-tunnel" in "cfgate-system") before the RGD is authored — kro
  # never sees the tokens.
  backendConfig:
    resources:
      # ───────────────────── Postgres tier ─────────────────────
      # Connection Secret. The non-sensitive fields are set here; the
      # pwgen Job below fills password + a full postgres:// URI, once.
      - id: dbCredentials
        template:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${schema.spec.name}-db-credentials
            namespace: default
          stringData:
            host: ${schema.spec.name}-db
            port: "5432"
            user: appuser
            dbname: appdb
      - id: dbPwgenAccount
        template:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: ${schema.spec.name}-db-pwgen
            namespace: default
      - id: dbPwgenRole
        template:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: ${schema.spec.name}-db-pwgen
            namespace: default
          rules:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "patch"]
      - id: dbPwgenBinding
        template:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: ${schema.spec.name}-db-pwgen
            namespace: default
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: ${dbPwgenRole.metadata.name}
          subjects:
            - kind: ServiceAccount
              name: ${dbPwgenAccount.metadata.name}
              namespace: default
      # Mints a random password and a complete postgres:// URI into the
      # credentials Secret — once; no-ops if password is already set, so
      # re-reconciles don't rotate it. kro never sees the value.
      - id: dbPwgen
        template:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${schema.spec.name}-db-pwgen
            namespace: default
          spec:
            backoffLimit: 5
            ttlSecondsAfterFinished: 600
            template:
              spec:
                serviceAccountName: ${dbPwgenAccount.metadata.name}
                restartPolicy: OnFailure
                containers:
                  - name: pwgen
                    image: bitnami/kubectl
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu
                        SECRET="${dbCredentials.metadata.name}"
                        if [ -z "$(kubectl get secret "$SECRET" -o jsonpath='{.data.password}' 2>/dev/null)" ]; then
                          PW="$(LC_ALL=C tr -dc 'a-z0-9' </dev/urandom | head -c 24)"
                          kubectl patch secret "$SECRET" --type merge \
                            -p "{\"stringData\":{\"password\":\"$PW\",\"uri\":\"postgres://appuser:$PW@${schema.spec.name}-db:5432/appdb\"}}"
                          echo "generated db credentials for $SECRET"
                        else
                          echo "db credentials already present for $SECRET"
                        fi
      - id: dbStatefulSet
        template:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: ${schema.spec.name}-db
            namespace: default
          spec:
            serviceName: ${schema.spec.name}-db
            replicas: 1
            # Tie the data PVC's lifecycle to the StatefulSet. The PVC is
            # created by the StatefulSet controller from volumeClaimTemplates
            # (NOT by kro), so it carries no kro labels and isn't in kro's
            # applyset — kro never garbage-collects it. With the k8s default
            # (whenDeleted: Retain) the PVC also outlives a StatefulSet delete,
            # so deleting an Application orphaned the volume: a same-name
            # recreate minted a fresh db password but Postgres recovered the old
            # data (old password) → "password authentication failed". Delete the
            # PVC when kro deletes the StatefulSet so a recreate starts clean.
            persistentVolumeClaimRetentionPolicy:
              whenDeleted: Delete
              whenScaled: Retain
            selector:
              matchLabels:
                app: ${schema.spec.name}-db
            template:
              metadata:
                labels:
                  app: ${schema.spec.name}-db
              spec:
                containers:
                  - name: postgres
                    image: postgres:${schema.spec.database.version}
                    env:
                      - name: POSTGRES_USER
                        value: appuser
                      - name: POSTGRES_DB
                        value: appdb
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ${dbCredentials.metadata.name}
                            key: password
                      # Keep PGDATA in a subdir so the PVC mount root (which
                      # may contain lost+found) doesn't trip initdb.
                      - name: PGDATA
                        value: /var/lib/postgresql/data/pgdata
                    ports:
                      - containerPort: 5432
                    volumeMounts:
                      - name: data
                        mountPath: /var/lib/postgresql/data
            volumeClaimTemplates:
              - metadata:
                  name: data
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 1Gi
      - id: dbService
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${schema.spec.name}-db
            namespace: default
          spec:
            type: ClusterIP
            selector:
              app: ${schema.spec.name}-db
            ports:
              - port: 5432
                targetPort: 5432

      # ───────────────────── Backend tier ─────────────────────
      # Tenant env vars ride ConfigMaps consumed via envFrom so the map inputs
      # need no CEL list synthesis; explicit container env (PORT, DATABASE_URL)
      # wins over envFrom on name conflicts, so platform vars can't be
      # clobbered.
      - id: backendEnvMap
        template:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${schema.spec.name}-backend-env
            namespace: default
          data: ${schema.spec.backendEnv}
      - id: backendDeployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${schema.spec.name}-backend
            namespace: default
          spec:
            replicas: ${schema.spec.backendReplicas}
            selector:
              matchLabels:
                app: ${schema.spec.name}-backend
            template:
              metadata:
                labels:
                  app: ${schema.spec.name}-backend
              spec:
                containers:
                  - name: backend
                    image: ${schema.spec.backendImage}
                    env:
                      # Bind the exposed port. Railpack/12-factor images read
                      # $PORT; without it they fall back to a framework default
                      # (e.g. Node 3000) and nothing listens on backendPort, so
                      # the Service/route get no backend and the edge 502s.
                      - name: PORT
                        value: ${string(schema.spec.backendPort)}
                      # Full connection string incl. password — sourced from
                      # the Secret, never templated in clear.
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: ${dbCredentials.metadata.name}
                            key: uri
                    envFrom:
                      - configMapRef:
                          name: ${backendEnvMap.metadata.name}
                    ports:
                      - containerPort: ${schema.spec.backendPort}
      - id: backendService
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${schema.spec.name}-backend
            namespace: default
          spec:
            type: ClusterIP
            selector:
              app: ${schema.spec.name}-backend
            ports:
              - port: ${schema.spec.backendPort}
                targetPort: ${schema.spec.backendPort}

      # ───────────────────── Frontend tier ─────────────────────
      - id: frontendEnvMap
        template:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: ${schema.spec.name}-frontend-env
            namespace: default
          data: ${schema.spec.frontendEnv}
      - id: frontendDeployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${schema.spec.name}-frontend
            namespace: default
          spec:
            replicas: ${schema.spec.frontendReplicas}
            selector:
              matchLabels:
                app: ${schema.spec.name}-frontend
            template:
              metadata:
                labels:
                  app: ${schema.spec.name}-frontend
              spec:
                containers:
                  - name: frontend
                    image: ${schema.spec.frontendImage}
                    # UI only — it calls the backend from the browser at
                    # /api/* on the same origin (the exposure layer routes /api
                    # to the backend), so no BACKEND_URL / server-side proxy.
                    # $PORT (= frontendPort) is injected so Railpack/12-factor
                    # images bind the exposed port instead of a framework
                    # default (e.g. Node 3000) — otherwise the edge 502s.
                    env:
                      - name: PORT
                        value: ${string(schema.spec.frontendPort)}
                    envFrom:
                      - configMapRef:
                          name: ${frontendEnvMap.metadata.name}
                    ports:
                      - containerPort: ${schema.spec.frontendPort}
      - id: frontendService
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${schema.spec.name}-frontend
            namespace: default
          spec:
            type: ClusterIP
            selector:
              app: ${schema.spec.name}-frontend
            ports:
              - port: ${schema.spec.frontendPort}
                targetPort: ${schema.spec.frontendPort}

      # ───────────────────── oauth2-proxy (the gate) ─────────────────────
      # Cookie secret, generated in-graph (32 random bytes, base64). The
      # pwgen Job fills it once; rotating it would invalidate live sessions,
      # so the Job no-ops if it's already set.
      - id: oauthCookieSecret
        includeWhen:
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${schema.spec.name}-oauth-cookie
            namespace: default
      - id: oauthPwgenAccount
        includeWhen:
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: ${schema.spec.name}-oauth-pwgen
            namespace: default
      - id: oauthPwgenRole
        includeWhen:
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: ${schema.spec.name}-oauth-pwgen
            namespace: default
          rules:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "patch"]
      - id: oauthPwgenBinding
        includeWhen:
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: ${schema.spec.name}-oauth-pwgen
            namespace: default
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: ${oauthPwgenRole.metadata.name}
          subjects:
            - kind: ServiceAccount
              name: ${oauthPwgenAccount.metadata.name}
              namespace: default
      - id: oauthPwgen
        includeWhen:
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${schema.spec.name}-oauth-pwgen
            namespace: default
          spec:
            backoffLimit: 5
            ttlSecondsAfterFinished: 600
            template:
              spec:
                serviceAccountName: ${oauthPwgenAccount.metadata.name}
                restartPolicy: OnFailure
                containers:
                  - name: pwgen
                    image: bitnami/kubectl
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu
                        SECRET="${oauthCookieSecret.metadata.name}"
                        if [ -z "$(kubectl get secret "$SECRET" -o jsonpath='{.data.cookie-secret}' 2>/dev/null)" ]; then
                          CS="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
                          kubectl patch secret "$SECRET" --type merge \
                            -p "{\"stringData\":{\"cookie-secret\":\"$CS\"}}"
                          echo "generated cookie secret for $SECRET"
                        else
                          echo "cookie secret already present for $SECRET"
                        fi
      - id: oauthDeployment
        includeWhen:
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${schema.spec.name}-oauth
            namespace: default
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ${schema.spec.name}-oauth
            template:
              metadata:
                labels:
                  app: ${schema.spec.name}-oauth
              spec:
                containers:
                  - name: oauth2-proxy
                    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
                    args:
                      - --provider=oidc
                      - --oidc-issuer-url=${schema.spec.oidc.issuerURL}
                      - --client-id=${schema.spec.oidc.clientID}
                      - --redirect-url=https://${schema.spec.expose.fqdn}/oauth2/callback
                      # Path-routed upstreams, both behind this gate: /api/* →
                      # backend, everything else → frontend. oauth2-proxy picks
                      # the longest matching path prefix. This is the byo-mode
                      # equivalent of the /api HTTPRoute used in mode=none, and
                      # keeps the backend authenticated (never exposed directly).
                      - --upstream=http://${schema.spec.name}-backend:${string(schema.spec.backendPort)}/api/
                      - --upstream=http://${schema.spec.name}-frontend:${string(schema.spec.frontendPort)}
                      - --http-address=0.0.0.0:4180
                      - --scope=${schema.spec.oidc.scopes}
                      # v1: allow any successfully-authenticated user. In
                      # platform mode that's any kedge/Dex user; oidc.emailDomains
                      # is reserved for finer control later.
                      - --email-domain=*
                      - --cookie-secure=true
                      # Behind the ingress/Cloudflare edge — trust XFF headers.
                      - --reverse-proxy=true
                      - --skip-provider-button=true
                    env:
                      # BYO: bridged from the tenant's cloud-credentials Secret.
                      # Platform: written by the controller after Dex CreateClient.
                      - name: OAUTH2_PROXY_CLIENT_SECRET
                        valueFrom:
                          secretKeyRef:
                            name: ${schema.spec.credentialsSecretName}
                            key: oidc_client_secret
                      - name: OAUTH2_PROXY_COOKIE_SECRET
                        valueFrom:
                          secretKeyRef:
                            name: ${oauthCookieSecret.metadata.name}
                            key: cookie-secret
                    ports:
                      - containerPort: 4180
      - id: oauthService
        includeWhen:
          - '${schema.spec.oidc.mode != "none"}'
        template:
          apiVersion: v1
          kind: Service
          metadata:
            name: ${schema.spec.name}-oauth
            namespace: default
          spec:
            type: ClusterIP
            selector:
              app: ${schema.spec.name}-oauth
            ports:
              - port: 4180
                targetPort: 4180

      # ──────────────── HTTPRoute (Gateway API exposure layer) ────────────────
      # Attaches to the platform Gateway (parentRefs computed from platform
      # config: ${kedge.gatewayName} in ${kedge.gatewayNamespace}, substituted
      # before the RGD is authored). No TLS config here — TLS terminates at the
      # Gateway edge (cfgate / Cloudflare Tunnel), which programs the DNS record
      # + tunnel route from this hostname. The backend is mode-dependent:
      # oidc.mode=none routes the public host straight to the frontend Service
      # (no gate — demo/dev); otherwise it routes to oauth2-proxy, which
      # authenticates and then proxies to the frontend.
      - id: httpRoute
        template:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: ${schema.spec.name}
            namespace: default
          spec:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: ${kedge.gatewayName}
                namespace: ${kedge.gatewayNamespace}
            hostnames:
              - ${schema.spec.expose.fqdn}
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  # Single-quoted: the CEL ternary contains ": " which YAML
                  # would otherwise read as a mapping. kro resolves the ${...}
                  # expression regardless of YAML scalar type.
                  - name: '${schema.spec.oidc.mode == "none" ? schema.spec.name + "-frontend" : schema.spec.name + "-oauth"}'
                    port: '${schema.spec.oidc.mode == "none" ? schema.spec.frontendPort : 4180}'

      # In mode=none there is no oauth2-proxy to path-route, so a second
      # HTTPRoute adds /api → backend alongside the "/" → frontend rule above
      # (same host + parent Gateway; Gateway API merges routes and the more
      # specific /api prefix wins). Gated to none — in byo this path would
      # bypass the gate, so there oauth2-proxy does the /api routing instead
      # (see its upstreams).
      - id: httpRouteAPI
        includeWhen:
          - '${schema.spec.oidc.mode == "none"}'
        template:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: ${schema.spec.name}-api
            namespace: default
          spec:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: ${kedge.gatewayName}
                namespace: ${kedge.gatewayNamespace}
            hostnames:
              - ${schema.spec.expose.fqdn}
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /api
                backendRefs:
                  - name: ${schema.spec.name}-backend
                    port: ${schema.spec.backendPort}
    # Projected onto the instance in the tenant's kcp workspace. url/host are
    # read from the HTTPRoute (this kro fork forbids ${schema.*} in status —
    # status may reference resources only — so we source the controller-stamped
    # fqdn from the HTTPRoute's hostnames rather than schema.spec.expose.fqdn).
    # The HTTPRoute is always created (only its backend changes by mode).
    # Per-tier readiness lets the portal show progress. No secret values are
    # surfaced.
    # ${kedge.appPublicPort} is substituted by the kro backend BEFORE kro sees
    # this CEL: "" in production (443 implied), ":<port>" when the Gateway is
    # only reachable on a forwarded port (local kind). The empty case leaves a
    # harmless `+ ""` in the expression.
    status:
      url: ${"https://" + httpRoute.spec.hostnames[0] + "${kedge.appPublicPort}"}
      host: ${httpRoute.spec.hostnames[0]}
      redirectURL: ${"https://" + httpRoute.spec.hostnames[0] + "${kedge.appPublicPort}" + "/oauth2/callback"}
      frontendReady: ${frontendDeployment.status.readyReplicas}
      backendReady: ${backendDeployment.status.readyReplicas}
      databaseReady: ${dbStatefulSet.status.readyReplicas}
      oauthReady: ${oauthDeployment.status.readyReplicas}
      dbConnectionSecretRef:
        name: ${dbCredentials.metadata.name}
        namespace: ${dbCredentials.metadata.namespace}
